# Yadraw Self-Hosted v1 — base compose (SH-03)
#
# Full contour: postgres, minio, init, api, web.
# Deliberately NOT included yet: Caddy/HTTPS (SH-07), local auth (SH-04),
# installers (SH-05/06), backup/update (SH-08), registry/multi-arch CI (SH-09).
#
# Run (local profile):
#   docker compose --env-file .env -f infra/selfhost/compose.yaml \
#     -f infra/selfhost/compose.local.yaml up -d --build

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yadraw}
      POSTGRES_USER: ${POSTGRES_USER:-yadraw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yadraw} -d ${POSTGRES_DB:-yadraw}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - yadraw

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - yadraw

  init:
    build:
      context: ../..
      dockerfile: infra/selfhost/init/Dockerfile
    image: ${YADRAW_IMAGE_REGISTRY:-}yadraw-init:${IMAGE_TAG:-local}
    environment:
      V2_DATABASE_URL: postgres://${POSTGRES_USER:-yadraw}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yadraw}
      MIGRATIONS_DIR: /migrations/v2
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-workspace-files}
      INIT_POSTGRES_TIMEOUT_MS: ${INIT_POSTGRES_TIMEOUT_MS:-60000}
      INIT_MINIO_TIMEOUT_MS: ${INIT_MINIO_TIMEOUT_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: "no"
    networks:
      - yadraw

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: ${YADRAW_IMAGE_REGISTRY:-}yadraw-api:${IMAGE_TAG:-local}
    environment:
      NODE_ENV: production
      YADRAW_V2_STORAGE: v2-postgres
      YADRAW_AUTH_MODE: ${YADRAW_AUTH_MODE:-supabase}
      YADRAW_BOOTSTRAP_TOKEN: ${YADRAW_BOOTSTRAP_TOKEN:-}
      PORT: 4000
      HOST: 0.0.0.0
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:3000}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
      V2_DATABASE_URL: postgres://${POSTGRES_USER:-yadraw}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yadraw}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-workspace-files}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - yadraw

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-support@example.com}
    image: ${YADRAW_IMAGE_REGISTRY:-}yadraw-web:${IMAGE_TAG:-local}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_URL: http://api:4000
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3000}
      YADRAW_AUTH_MODE: ${YADRAW_AUTH_MODE:-supabase}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-support@example.com}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - yadraw

networks:
  yadraw:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
